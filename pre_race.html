      const historyData = (athlete.history || [])
        .filter(h =>
          h.formatted_date &&
          h.mark_seconds &&
          Number(h.mark_seconds) < 9999 &&
          new Date(h.formatted_date).getFullYear() >= minYear
        )
        .slice(0, maxRaces)
        .map(h => ({
          x: h.formatted_date,
          y: Number(h.mark_seconds)
        }));

      return {
        label: `${athlete.athlete_name} (${athlete.final_seed_display || ''})`,
        data: historyData,
        borderColor: colors[index % colors.length],
        backgroundColor: colors[index % colors.length],
        tension: 0.1,
        fill: false
      };
    });

    chartInstances[groupName] = new Chart(canvas, {
      type: 'line',
      data: {
        datasets: datasets
      },
      options: {
        scales: {
          x: {
            type: 'time',
            time: {
              unit: 'month'
            },
            title: {
              display: true,
              text: 'Date'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Performance'
            },
            ticks: {
              callback: function(value) {
                return seconds_to_time_str(value);
              }
            }
          }
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const athlete = context.dataset.label || '';
                const value = context.parsed.y;
                return `${athlete}: ${seconds_to_time_str(value)}`;
              }
            }
          },
          legend: {
            position: 'right',
            labels: {
              font: {
                size: 10
              }
            }
          }
        }
      }
    });
  }

  function renderAllTables() {
    Object.keys(allData).forEach(groupName => renderTableAndGraph(groupName));
  }

  function openTab(evt, groupName) {
    document.querySelectorAll('.tabcontent').forEach(tc => tc.style.display = "none");
    document.querySelectorAll('.tablinks').forEach(tl => tl.className = tl.className.replace(" active", ""));

    const tab = document.getElementById(groupName);

    if (tab) {
      tab.style.display = "block";
    }

    evt.currentTarget.className += " active";
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderAllTables();

    const firstTab = document.querySelector('.tablinks');

    if (firstTab) {
      firstTab.click();
    }
  });
</script>

</body>
</html>
